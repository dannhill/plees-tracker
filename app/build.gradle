plugins {
    id 'com.google.devtools.ksp'
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Dynamic Versioning & Package ID Resolution
def baseVersionCode = 66
def baseVersionName = "26.8"
def baseApplicationId = "hu.vmiklos.plees_tracker"

def isAutoSleepMode = project.hasProperty("autosleep") ?
    (project.property("autosleep") == null || project.property("autosleep").toString().trim() == "" || project.property("autosleep").toString().toBoolean() || project.property("autosleep").toString() == "true") :
    (System.getenv("AUTOSLEEP") == "true")

def customAppId = project.findProperty("autosleepApplicationId") ?:
    project.findProperty("customApplicationId") ?:
    System.getenv("AUTOSLEEP_APPLICATION_ID")

def resolvedApplicationId = customAppId ?:
    (isAutoSleepMode ? "hu.vmiklos.plees_tracker.autosleep" : baseApplicationId)

def customVCode = project.findProperty("autosleepVersionCode") ?:
    project.findProperty("customVersionCode") ?:
    System.getenv("AUTOSLEEP_VERSION_CODE")

def resolvedVersionCode = customVCode != null ?
    customVCode.toString().toInteger() :
    (isAutoSleepMode ? baseVersionCode + 100000 : baseVersionCode)

def customVName = project.findProperty("autosleepVersionName") ?:
    project.findProperty("customVersionName") ?:
    System.getenv("AUTOSLEEP_VERSION_NAME")

def resolvedVersionName = customVName != null ?
    customVName.toString() :
    (isAutoSleepMode ? "${baseVersionName}-autosleep" : baseVersionName)

def getSigningProp(String propName, String envName) {
    return project.findProperty(propName) ?: System.getenv(envName) ?: ""
}

android {
    kotlinOptions {
        kotlinOptions.allWarningsAsErrors = true
    }
    testOptions {
        unitTests.all {
            systemProperty 'user.timezone', 'UTC'
            maxHeapSize = '2048m'
        }
    }

    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId resolvedApplicationId
        minSdkVersion 24
        targetSdkVersion 36
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.incremental": "true"]
            }
        }
    }

    def keystorePath = getSigningProp("signingStoreFile", "SIGNING_STORE_FILE")
    if (!keystorePath) {
        keystorePath = "keystore/plees_keystore.jks"
    }
    def keystoreFile = file(keystorePath)
    def storePass = getSigningProp("signingStorePassword", "SIGNING_STORE_PASSWORD")
    def keyAliasName = getSigningProp("signingKeyAlias", "SIGNING_KEY_ALIAS")
    def keyPass = getSigningProp("signingKeyPassword", "SIGNING_KEY_PASSWORD")

    signingConfigs {
        release {
            if (keystoreFile.exists() && storePass) {
                storeFile = keystoreFile
                storePassword = storePass
                keyAlias = keyAliasName
                keyPassword = keyPass
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists() && storePass) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    buildFeatures {
        viewBinding true
    }
    // The "store" dimension keeps proprietary Google Play Services code opt-in at build time:
    // - foss (default): no Google dependencies, suitable for F-Droid.
    // - gplay: adds Google Drive backup support.
    flavorDimensions += "store"
    productFlavors {
        foss {
            dimension "store"
        }
        gplay {
            dimension "store"
        }
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lint {
        disable 'MissingTranslation'
    }
    packaging {
        resources {
            // The Google API client libraries (gplay flavor) ship duplicate META-INF metadata
            // files that would otherwise clash when merging.
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }
    namespace 'hu.vmiklos.plees_tracker'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json implementation for unit tests: the android.jar bundled one is a stub that
    // throws at runtime, so BackupDestination's JSON (de)serialization can't be tested without it.
    testImplementation 'org.json:json:20260522'
    testImplementation 'androidx.health.connect:connect-testing:1.0.0-alpha03'
    androidTestImplementation 'androidx.health.connect:connect-testing:1.0.0-alpha03'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.4.0"
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "com.mikepenz:aboutlibraries:7.1.0"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'

    // gplay flavor only: Google Drive (appDataFolder) backup. These are proprietary and are kept
    // out of the foss flavor so the F-Droid build stays free of Google dependencies.
    gplayImplementation 'com.google.android.gms:play-services-auth:21.6.0'
    gplayImplementation('com.google.api-client:google-api-client-android:2.9.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava', module: 'guava-jdk5'
    }
    gplayImplementation('com.google.apis:google-api-services-drive:v3-rev20240914-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
    }
}
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
